[project]
name = "accounting-firm"
version = "0.0.1"
description = "AI-native accounting firm — CPA-signed deliverables composed over the ReDevOps runtime stack"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = []                      # core is stdlib-only (deterministic + governed)

[project.optional-dependencies]
llm = ["httpx>=0.27"]                  # extraction/assessment/drafting seams (Context Runtime model calls)
kernel = [                             # the ReDevOps kernel: governed LLM (N7) + Context Runtime (N6) +
                                       # durable event ledger (N4/N5). No ML deps — grounds over the
                                       # curated corpus via the Context Runtime door; add [runtime] for rag.
  "agentic-os @ git+https://github.com/redevops-io/agentic-os.git@v0.3.21",
]
runtime = [                            # full composition onto the real runtimes (adds the rag retrieval engine)
  "agentic-os @ git+https://github.com/redevops-io/agentic-os.git@v0.3.21",
  "redevops-rag @ git+https://github.com/redevops-io/redevops-rag.git@v0.4.0",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["accounting_firm*"]
