[project]
name = "accounting-firm"
version = "0.0.1"
description = "AI-native accounting firm — CPA-signed deliverables composed over the ReDevOps runtime stack"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = []                      # core is stdlib-only (deterministic + governed)

[project.optional-dependencies]
llm = ["httpx>=0.27"]                  # extraction/assessment/drafting seams (Context Runtime model calls)
runtime = [                            # compose onto the real runtimes
  "redevops-rag @ git+https://github.com/redevops-io/redevops-rag.git@main",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["accounting_firm*"]
